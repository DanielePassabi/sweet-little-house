name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/landscape.js
          node --check dist/movement.js
          node --check dist/render-state.js
          node --check dist/furniture-collisions.js
          node --check dist/kitchen-layout.js
          node --check dist/kitchen-variants.js
          node --check dist/kitchen.js
          node --check dist/dining.js
          node --check dist/sofa-layout.js
          node --check dist/sofa.js
          node --check dist/room3-layout.js
          node --check dist/room3.js
          node --check dist/media-layout.js
          node --check dist/media-station.js
          node --check dist/tv-console.js
          node --check dist/berserk-books.js
          node --check dist/entryway-layout.js
          node --check dist/entryway-motion.js
          node --check dist/entryway.js
          node --check dist/television-video.js
          node --check dist/interior-lighting.js
          node --check dist/sliding-doors.js
          node --check dist/hinged-doors.js
          node --check dist/doors.js
          node --check dist/bathroom-tiles.js
          node --check dist/robot-navigation.js
          node --check dist/robot-vacuum.js
          node --check dist/bed.js
          node --check dist/sanitary.js
          node --check dist/sanitary-layout.js
          node --check dist/wine-cabinet.js
          node --check dist/wine-cabinet-layout.js
          node --check dist/floor-layout.js
          node --check dist/lighting-performance.js
          node --check dist/material-details.js
          node --check dist/solar.js
          node --check dist/vendor/suncalc.js
          node --check dist/model.js
          node --check dist/wall-geometry.js

      - name: Run geometry tests
        run: |
          node tests/spatial.mjs
          node tests/landscape.mjs
          node tests/movement.mjs
          node tests/render-state.mjs
          node tests/furniture-collisions.mjs
          node tests/kitchen.mjs
          node tests/kitchen-variants.mjs
          node tests/sofa.mjs
          node tests/room3.mjs
          node tests/media-station.mjs
          node tests/tv-console.mjs
          node tests/berserk-books.mjs
          node tests/entryway.mjs
          node tests/television-video.mjs
          node tests/interior-lighting.mjs
          node tests/sliding-doors.mjs
          node tests/hinged-doors.mjs
          node tests/bathroom-tiles.mjs
          node tests/robot-vacuum.mjs
          node tests/bed.mjs
          node tests/sanitary.mjs
          node tests/wine-cabinet.mjs
          node tests/floor-layout.mjs
          node tests/solar.mjs
          node tests/wall-joints.mjs

  deploy:
    name: Deploy site
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
